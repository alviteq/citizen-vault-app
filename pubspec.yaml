name: citizen_vault_app
description: OwnKeep private, offline-first Personal Life OS.
publish_to: none
version: 5.0.0+28

environment:
  sdk: ^3.12.1


dependencies:
  archive: 4.0.7
  cunning_document_scanner: ^2.8.0
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.2.0
  flutter_riverpod: 3.3.2
  go_router: 17.3.0
  image_picker: 1.2.3
  image: 4.8.0
  local_auth: 3.0.2
  mime: 2.0.0
  path_provider: 2.1.6
  pdfrx: 2.4.7
  shared_preferences: 2.5.3
  timezone: 0.11.1
  vault_backup: 0.5.0
  vault_crypto: 0.2.0
  vault_database: 0.9.0
  vault_domain: 0.9.0
  vault_ingestion: 0.8.0
  vault_notifications: 0.9.0
  vault_objects: 0.7.0
  vault_ocr: 0.8.0
  vault_platform: 0.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  vault_test_support: 0.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fixtures/

flutter_launcher_icons:
  image_path: "assets/images/ownkeep_app_icon.png"
  android: true
  adaptive_icon_background: "#000B2B"
  adaptive_icon_foreground: "assets/images/ownkeep_app_icon.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/ownkeep_app_icon.png"

workspace:
  - packages/vault_backup
  - packages/vault_crypto
  - packages/vault_database
  - packages/vault_domain
  - packages/vault_ingestion
  - packages/vault_notifications
  - packages/vault_objects
  - packages/vault_ocr
  - packages/vault_platform
  - packages/vault_test_support
